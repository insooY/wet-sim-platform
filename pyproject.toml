[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wet-sim-platform"
version = "0.1.0"
description = "Semiconductor Wet Process 3D Equipment Simulation Platform"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "pyvista>=0.43",
    "vtk>=9.3",
    "pyzmq>=25.1",
    "PyYAML>=6.0",
    "pyserial>=3.5",
    "pymodbus>=3.6",
]

[project.optional-dependencies]
plc = [
    "python-snap7>=1.3",
    "pyads>=3.4",
]
prod = [
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
]

[project.scripts]
wet-sim = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.pyinstaller]
name = "WetSimPlatform"
onefile = true
windowed = true
icon = "assets/icons/app.ico"
