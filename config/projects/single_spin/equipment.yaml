equipment:
  name: "Single Wafer Spin Cleaner"
  type: single_spin
  wafer_size: 300mm
  cassette_slots: 1
  loadports: 1

motors:
  - id: M1
    name: "Spin Chuck"
    type: servo
    range: [0, 3000]          # rpm
    max_speed: 3000.0
    accel: 500.0
    simulation: {}

  - id: M2
    name: "Nozzle Arm"
    type: servo
    range: [0, 300]           # mm (홈 → 웨이퍼 중심)
    max_speed: 80.0
    accel: 40.0
    simulation: {}

valves:
  - id: V1
    name: "SC1 Supply"
    type: pneumatic
    response_ms: 150

  - id: V2
    name: "DHF Supply"
    type: pneumatic
    response_ms: 150

  - id: V3
    name: "DIW Rinse"
    type: pneumatic
    response_ms: 100

  - id: V4
    name: "IPA Dry"
    type: pneumatic
    response_ms: 100

  - id: V5
    name: "N2 Purge"
    type: pneumatic
    response_ms: 80

sensors:
  - id: S1
    name: "Chuck Temperature"
    type: temperature
    unit: "°C"
    range: [15, 90]
    initial_value: 23.0
    simulation:
      noise: 0.1
      response_tau: 3.0

  - id: S2
    name: "SC1 Flow Rate"
    type: flow
    unit: "mL/min"
    range: [0, 500]
    initial_value: 0.0
    simulation:
      noise: 1.0
      response_tau: 0.5

  - id: S3
    name: "Spin Speed"
    type: flow
    unit: "rpm"
    range: [0, 3000]
    initial_value: 0.0
    simulation:
      noise: 2.0
      response_tau: 0.2

heaters:
  - id: H1
    name: "Chuck Heater"
    power_kw: 2.0
    target_range: [20, 80]
    tau: 15.0
